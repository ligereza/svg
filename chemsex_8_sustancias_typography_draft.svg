<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1536" viewBox="0 0 1024 1536">
  <title>Maqueta tipográfica para ocho sustancias</title>
  <desc>Imagen de referencia con un título lateral y ocho nombres distribuidos alrededor de los iconos.</desc>
  <image x="0" y="0" width="1024" height="1536" preserveAspectRatio="xMidYMid slice"
         href="C:/Users/issvk/.codex/generated_images/01a01361-7f6d-76b0-b1b1-f4c1c81197fe/exec-84de0cc8-4e63-41bb-99e7-eb6f42f303da.png"/>

  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#101527" flood-opacity="0.65"/>
    </filter>
    <style>
      .name { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 23px; letter-spacing: 1.2px; fill: #fff8e7; paint-order: stroke; stroke: #182038; stroke-width: 7px; stroke-linejoin: round; }
      .nameSmall { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 1px; fill: #fff8e7; paint-order: stroke; stroke: #182038; stroke-width: 6px; stroke-linejoin: round; }
      .guide { fill: none; stroke: #ffe9a5; stroke-width: 3; opacity: .92; }
      .dot { fill: #ff7091; stroke: #182038; stroke-width: 3; }
      .kicker { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 4px; fill: #ffdc75; }
    </style>
  </defs>

  <!-- Título único: entra desde el borde y no tapa los iconos. -->
  <g transform="rotate(-4 125 150)" filter="url(#softShadow)">
    <path d="M28 54 L263 43 L270 211 L37 222 Z" fill="#15203b" fill-opacity=".88" stroke="#f8d574" stroke-width="3"/>
